apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/leptostack
  - ../../base/devops

patches:
  - target:
      kind: ConfigMap
      name: leptostack-config
      namespace: flux-system
    patch: |-
      - op: replace
        path: /data/cluster_name
        value: dev
      - op: replace
        path: /data/leptostack_domain
        value: hadeed.dev
      - op: replace
        path: /data/leptostack_name
        value: portal-dev
  - target:
      kind: Kustomization
      name: keycloak-crd
      namespace: flux-system
    patch: |-
      - op: add
        path: /spec/patches/-
        value:
          - target:
              group: rbac.authorization.k8s.io
              version: v1
              kind: ClusterRoleBinding
              name: keycloak-operator-clusterrole-binding
            patch: |
              - op: add
                path: "/subjects/-"
                value:
                  - kind: ServiceAccount
                    name: keycloak-operator
                    namespace: devops-keycloak
