# LeptoStack custom configuration -- DO NOT CHANGE THIS FILE! Add your cluster level settings as overlay patches
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: leptostack-config
  namespace: flux-system
data:
  cluster_name: local
  leptostack_domain: minikube.test
  leptostack_name: portal
  leptostack_smtp_server: ""
  leptostack_smtp_port: ""
  leptostack_smtp_username: ""
  leptostack_smtp_password: ""
  leptostack_acme_email: ""
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: leptostack-base
  namespace: flux-system
spec:
  interval: 1m0s
  ref:
    branch: main
  secretRef:
    name: leptostack-base
  url: https://github.com/leptostack-fluxcd/leptostack-base.git
