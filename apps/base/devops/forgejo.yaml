---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: devops-forgejo-pre
  namespace: flux-system
spec:
  interval: 720m0s
  timeout: 10m
  dependsOn:
    - name: devops-pgcluster
    - name: devops-keycloak
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/forgejo/pre
  prune: true
  wait: true
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: leptostack
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: devops-forgejo
  namespace: flux-system
spec:
  interval: 720m0s
  timeout: 10m
  dependsOn:
    - name: devops-forgejo-pre
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/forgejo
  prune: false
  wait: true
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: leptostack
