apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ${leptostack_name}-sso-tls
  namespace: ${cluster_name}-keycloak
spec:
  secretName: ${leptostack_name}-sso-tls
  issuerRef:
    name: internal-issuer
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
    - ${leptostack_name}-sso-admin.${leptostack_domain}
    - ${leptostack_name}-sso.${leptostack_domain}
    - ${leptostack_name}-sso-service.${cluster_name}-keycloak.svc.cluster.local