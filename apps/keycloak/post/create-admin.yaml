---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: "keycloak-admin-secret"
  namespace: ${cluster_name}-keycloak
spec:
  refreshInterval: "0"
  refreshPolicy: CreatedOnce
  target:
    name: keycloak-admin
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        username: keycloak-admin
        password: "{{ .password }}"
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: ClusterGenerator
        name: "password-generator"
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: "keycloak-admin-push-secret"
  namespace: ${cluster_name}-keycloak
spec:
  refreshInterval: "0"
  secretStoreRefs:
  - name: ${cluster_name}-bao
    kind: ClusterSecretStore
  selector:
    secret:
      name: keycloak-admin
  dataTo:
    - storeRef:
        name: ${cluster_name}-bao
        kind: ClusterSecretStore
      remoteKey: dynamic/keycloak/keycloak-admin
---
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-create-admin
  namespace: ${cluster_name}-keycloak
spec:
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: create-admin
        image: quay.io/keycloak/keycloak:26.6
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        command:
        - /bin/bash
        - -c
        - |
          KCADM="/opt/keycloak/bin/kcadm.sh"
          SERVER="https://${leptostack_name}-sso-service.${cluster_name}-keycloak.svc.cluster.local:8443"
          MAX_RETRIES=30
          RETRY_DELAY=10

          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "=== Attempt $attempt/$MAX_RETRIES ==="

            # Wait for Keycloak to be ready and configure credentials
            LOGGED_IN=false
            for i in $(seq 1 12); do
              if $KCADM config credentials \
                --server "$SERVER" \
                --realm master \
                --user "$KC_INITIAL_ADMIN_USER" \
                --truststore /truststore/truststore.jks 2>/dev/null; then
                echo "Logged in as initial admin, proceeding with setup."
                LOGGED_IN=true
                break
              elif $KCADM config credentials \
                --server "$SERVER" \
                --realm master \
                --user "$KC_NEW_ADMIN_USER" \
                --password "$KC_NEW_ADMIN_PASSWORD" \
                --truststore /truststore/truststore.jks 2>/dev/null; then
                echo "New admin user already configured, nothing to do."
                exit 0
              else
                echo "Keycloak not ready yet, retrying in 5s..."
                sleep 5
              fi
            done

            if [ "$LOGGED_IN" != "true" ]; then
              echo "Could not connect to Keycloak, retrying in $${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
              continue
            fi

            # Create user
            if ! USER_ID=$($KCADM create users \
              -r master \
              -s username="$KC_NEW_ADMIN_USER" \
              -s email="$KC_NEW_ADMIN_USER@${leptostack_domain}" \
              -s firstName=Keycloak \
              -s lastName=Admin \
              -s enabled=true \
              --truststore /truststore/truststore.jks \
              --id 2>&1); then
              echo "Failed to create user: $USER_ID. Retrying in $${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
              continue
            fi
            echo "User created with ID: $USER_ID"

            # Set password
            if ! $KCADM set-password \
              -r master \
              --username "$KC_NEW_ADMIN_USER" \
              --new-password "$KC_NEW_ADMIN_PASSWORD" \
              --truststore /truststore/truststore.jks 2>&1; then
              echo "Failed to set password. Retrying in $${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
              continue
            fi
            echo "Password set successfully."

            # Add realm-admin role
            if ! $KCADM add-roles \
              -r master \
              --uusername "$KC_NEW_ADMIN_USER" \
              --rolename admin \
              --truststore /truststore/truststore.jks 2>&1; then
              echo "Failed to add admin role. Retrying in $${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
              continue
            fi
            echo "Admin role assigned."

            # Delete initial admin user
            INITIAL_ADMIN_ID=$($KCADM get users -r master -q username="$KC_INITIAL_ADMIN_USER" --fields id --format csv --noquotes --truststore /truststore/truststore.jks 2>&1)
            if [ -z "$INITIAL_ADMIN_ID" ]; then
              echo "Could not find initial admin user to delete. Retrying in $${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
              continue
            fi

            if ! $KCADM delete users/"$INITIAL_ADMIN_ID" \
              -r master \
              --truststore /truststore/truststore.jks 2>&1; then
              echo "Failed to delete initial admin. Retrying in $${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
              continue
            fi

            echo "All steps completed successfully."
            exit 0
          done

          echo "ERROR: Failed after $MAX_RETRIES attempts."
          exit 1
        env:
        - name: KC_CLI_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ${leptostack_name}-sso-initial-admin
              key: password
        - name: KC_INITIAL_ADMIN_USER
          valueFrom:
            secretKeyRef:
              name: ${leptostack_name}-sso-initial-admin
              key: username
        - name: KC_CLI_TRUSTSTORE_PASSWORD
          value: changeit
        - name: KC_NEW_ADMIN_USER
          valueFrom:
            secretKeyRef:
              name: keycloak-admin
              key: username
        - name: KC_NEW_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-admin
              key: password
        volumeMounts:
        - name: truststore
          mountPath: /truststore
          readOnly: true
        - name: config
          mountPath: /opt/keycloak/.keycloak
      volumes:
      - name: config
        emptyDir: {}
      - name: truststore
        configMap:
          name: internal-ca-bundle
          items:
          - key: truststore.jks
            path: truststore.jks
