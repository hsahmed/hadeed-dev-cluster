              single: "false"
              attribute.nameformat: Basic
              attribute.name: Role
      - id: 468a97bb-0ac9-42b6-8dbb-6e79092a3156
        name: saml_organization
        description: Organization Membership
        protocol: saml
        attributes:
          display.on.consent.screen: "false"
        protocolMappers:
          - id: 14ab1f80-e571-44d3-a50b-42f3e25f2299
