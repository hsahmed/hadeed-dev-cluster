apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo
  namespace: flux-system
spec:
  releaseName: forgejo
  targetNamespace: devops-forgejo
  interval: 1h
  chart:
    spec:
      chart: forgejo
      version: "17.1.4"
      sourceRef:
        kind: HelmRepository
        name: forgejo
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    clusterDomain: hadeed.dev
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
        add:
          - SYS_CHROOT
      privileged: false
      readOnlyRootFilesystem: true
      runAsGroup: 1000
      runAsNonRoot: true
      runAsUser: 1000

    resources:
      limits:
        cpu: 2
        memory: 4Gi
      requests:
        cpu: 500m
        memory: 512Mi

    gitea:
      admin:
        existingSecret: forgejo-admin-secret

      oauth:
        - name: 'Hadeed SSO'
          provider:
          key:
          secret:
          existingSecret:
          autoDiscoverUrl:
        #   useCustomUrls:
        #   customAuthUrl:
        #   customTokenUrl:
        #   customProfileUrl:
        #   customEmailUrl:

      config:
        APP_NAME: 'Hadeed Git Server'
        database:
          DB_TYPE: postgres
          HOST:
          NAME:
          USER:
          PASSWD:
          