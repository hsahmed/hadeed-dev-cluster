kind: Kustomization
metadata:
  name: crossplane-post
  namespace: flux-system
spec:
  interval: 720m0s
  dependsOn:
    - name: crossplane
  sourceRef:
    kind: GitRepository
    name: leptostack-base
  serviceAccountName: kustomize-controller
  path: ./infrastructure/crossplane/post
