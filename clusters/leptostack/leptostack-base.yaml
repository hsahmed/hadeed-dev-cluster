apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: base
  namespace: flux-system
spec:
  interval: 720m0s
  timeout: 10m
  dependsOn:
    - name: cert-manager
    - name: trust-manager
    - name: external-secrets
    - name: crossplane
    - name: operators
  sourceRef:
    kind: GitRepository
    name: leptostack-base
  path: ./leptostack/base
  prune: true
  wait: true
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: leptostack
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: leptostack-config
---
