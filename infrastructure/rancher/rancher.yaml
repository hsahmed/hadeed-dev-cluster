---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: rancher-stable
  namespace: flux-system
spec:
  interval: 1h
  url: https://releases.rancher.com/server-charts/stable
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rancher
  namespace: flux-system
spec:
  releaseName: rancher
  targetNamespace: cattle-system
  interval: 1h
  chart:
    spec:
      chart: rancher
      version: "2.14.3"
      sourceRef:
        kind: HelmRepository
        name: rancher-stable
        namespace: flux-system
  install:
    createNamespace: true
  values:
    hostname: rancher.c00.hadeed.dev
    replicas: 1
